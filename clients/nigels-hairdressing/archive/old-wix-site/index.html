<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nigel's Hairdressing: original Wix site (archived)</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #f4f1ec; --ink: #2a1a14; --muted: #6b5d55; --line: #d9d0c5; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width: 1480px; margin: 0 auto; padding: 24px 16px 8px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin-top: 16px; }
  .tabs a { padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); text-decoration: none; font-size: 14px; }
  .tabs a:target, .tabs a:hover { background: var(--ink); color: #fff; }
  main { max-width: 1480px; margin: 0 auto; padding: 16px; display: grid; gap: 32px; }
  figure { margin: 0; }
  figcaption { font-weight: 600; margin-bottom: 8px; }
  img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); background: #fff; }
  .mobile img { width: 360px; }
</style>
</head>
<body>
<header>
  <h1>Nigel's Hairdressing: original Wix site</h1>
  <p>Captured 8 October 2026 from www.nigelshairdressingwiganandrochdale.com, before the move to the new CG Design &amp; Co. build. Full-page screenshots, so this page keeps working after the Wix site is switched off.</p>
  <nav class="tabs"><a href="#desktop">Desktop</a><a href="#mobile">Mobile</a></nav>
</header>
<main>
  <figure id="desktop"><figcaption>Desktop (1440px)</figcaption><img src="desktop-full.png" alt="Full-page screenshot of the original Nigel's Hairdressing Wix website on desktop" width="1440" height="4330"></figure>
  <figure id="mobile" class="mobile"><figcaption>Mobile (360px)</figcaption><img src="mobile-full.png" alt="Full-page screenshot of the original Nigel's Hairdressing Wix website on mobile" width="360" height="2952"></figure>
</main>
</body>
</html>
